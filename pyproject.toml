[project]
name = "protocol-copilot"
version = "0.1.0"
description = "Drafts longevity clinic care plans from lab PDFs and wearables. Clinician approves every word."
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = ["pdfplumber>=0.11", "reportlab>=4.0", "pyyaml>=6.0", "pydantic>=2.6", "fastapi>=0.110", "uvicorn>=0.29", "python-multipart>=0.0.9"]

[project.optional-dependencies]
llm = ["anthropic>=0.40"]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
